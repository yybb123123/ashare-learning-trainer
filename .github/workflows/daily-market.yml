name: Update daily A-share learning data
on:
  schedule:
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'akshare>=1.16,<3' pandas
      - run: python tools/update_daily_market.py
      - name: Commit verified-structure market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-market.json
          if ! git diff --cached --quiet; then
            git commit -m "Update A-share daily learning data"
            git push
          fi
